<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="-36 -36 611 419" width="611" height="419"
     role="img" aria-label="go-faster/fs">
  <title>go-faster/fs</title>
  <style>
    /* Dark is the base. On light surfaces the palette drops a few stops, the
       bloom comes off and the specular pass is withdrawn, so the artwork keeps
       its contrast instead of blowing out against white. */
    .f0 { stop-color: #00808f }
    .f1 { stop-color: #00a29c }
    .f2 { stop-color: #01add8 }
    .f3 { stop-color: #33c4e6 }
    .f4 { stop-color: #74d9f2 }
    .art { filter: url(#bloom) }
    @media (prefers-color-scheme: light) {
      .f0 { stop-color: #04697a }
      .f1 { stop-color: #00868c }
      .f2 { stop-color: #0090bd }
      .f3 { stop-color: #00a8d2 }
      .f4 { stop-color: #2ec2e0 }
      .art { filter: none }
      .glint { display: none }
    }
  </style>
  <defs>
    <!-- One gradient period spans the whole logo, so a single bright crest
         travels through the bars and then the wordmark as one light. -->
    <linearGradient id="flow" gradientUnits="userSpaceOnUse" spreadMethod="repeat"
                    x1="94.31" y1="190.00" x2="705.69" y2="601.23">
      <stop offset="0" class="f0"/>
      <stop offset="0.16" class="f1"/>
      <stop offset="0.34" class="f2"/>
      <stop offset="0.44" class="f3"/>
      <stop offset="0.50" class="f4"/>
      <stop offset="0.56" class="f3"/>
      <stop offset="0.66" class="f2"/>
      <stop offset="0.84" class="f1"/>
      <stop offset="1" class="f0"/>
      <animateTransform attributeName="gradientTransform" type="translate"
                        from="0 0" to="611.38 411.23" dur="4s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="flowText" gradientUnits="userSpaceOnUse" spreadMethod="repeat"
                    x1="-399.41" y1="-4362.81" x2="7606.41" y2="1022.09">
      <stop offset="0" class="f0"/>
      <stop offset="0.16" class="f1"/>
      <stop offset="0.34" class="f2"/>
      <stop offset="0.44" class="f3"/>
      <stop offset="0.50" class="f4"/>
      <stop offset="0.56" class="f3"/>
      <stop offset="0.66" class="f2"/>
      <stop offset="0.84" class="f1"/>
      <stop offset="1" class="f0"/>
      <animateTransform attributeName="gradientTransform" type="translate"
                        from="0 0" to="8005.82 5384.89" dur="4s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="glint" gradientUnits="userSpaceOnUse" spreadMethod="repeat"
                    x1="94.31" y1="190.00" x2="705.69" y2="601.23">
      <stop offset="0" stop-color="#a8e8ff" stop-opacity="0"/>
      <stop offset="0.40" stop-color="#a8e8ff" stop-opacity="0"/>
      <stop offset="0.50" stop-color="#a8e8ff" stop-opacity="0.2"/>
      <stop offset="0.60" stop-color="#a8e8ff" stop-opacity="0"/>
      <stop offset="1" stop-color="#a8e8ff" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate"
                        from="0 0" to="611.38 411.23" dur="4s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="glintText" gradientUnits="userSpaceOnUse" spreadMethod="repeat"
                    x1="-399.41" y1="-4362.81" x2="7606.41" y2="1022.09">
      <stop offset="0" stop-color="#a8e8ff" stop-opacity="0"/>
      <stop offset="0.40" stop-color="#a8e8ff" stop-opacity="0"/>
      <stop offset="0.50" stop-color="#a8e8ff" stop-opacity="0.2"/>
      <stop offset="0.60" stop-color="#a8e8ff" stop-opacity="0"/>
      <stop offset="1" stop-color="#a8e8ff" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate"
                        from="0 0" to="8005.82 5384.89" dur="4s" repeatCount="indefinite"/>
    </linearGradient>

    <!-- Two-stage bloom: a wide halo for ambient glow and a tight one that
         keeps edges hot, with the crisp artwork composited back on top. -->
    <filter id="bloom" x="-25%" y="-25%" width="150%" height="150%"
            color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceGraphic" stdDeviation="13" result="wide"/>
      <feComponentTransfer in="wide" result="wideDim">
        <feFuncA type="linear" slope="0.48"/>
      </feComponentTransfer>
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="near"/>
      <feComponentTransfer in="near" result="nearDim">
        <feFuncA type="linear" slope="0.4"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="wideDim"/>
        <feMergeNode in="nearDim"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

