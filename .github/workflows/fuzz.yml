name: fuzz

# Actively fuzzes the untrusted-input wire parsers (SigV4 authorization and
# credential parsing, aws-chunked framing, and the XML request-body decoders)
# for a bounded time, searching for panics and DoS inputs. The seed corpora
# also run as ordinary unit tests in the main test suite, so known crashers
# are permanent regressions independent of this search.
#
# Runs on PRs (short) and nightly (longer) via scripts/fuzz.sh.
#
# A -fuzztime run always ends by hitting its deadline, and a worker still
# executing as it fires turns a finished search into a failure. fuzz.sh retries
# that one case; scripts/fuzz_selftest.sh pins what it will and will not
# tolerate.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    # Room for every target to use its full budget twice: a retried target
    # costs double, and a job killed by its own timeout is the failure this
    # workflow is supposed to distinguish from a finding.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'

      - name: Check the fuzz runner itself
        run: ./scripts/fuzz_selftest.sh

      - name: Fuzz wire parsers
        env:
          # Longer search on the nightly schedule, quick smoke on PRs. Two
          # seconds barely outlasts the baseline-coverage pass, which left the
          # PR job spending most of its time not fuzzing and made the
          # deadline-expiry failure common enough to see.
          FUZZTIME: ${{ github.event_name == 'schedule' && '90s' || '15s' }}
        run: ./scripts/fuzz.sh
