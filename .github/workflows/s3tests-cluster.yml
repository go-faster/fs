name: s3tests-cluster

# Runs the ceph/s3-tests conformance suite against a CLUSTERED fs: three nodes
# in three racks over a real etcd, writing at quorum across failure domains.
#
# The single-node s3tests workflow proves the S3 surface is correct over
# storagefs. This one proves the same surface stays correct over the replicated
# data plane — the wire behaviour a client sees must not depend on how many
# nodes are behind the endpoint. clusterstore's Go-level conformance test
# (storagetest.Run) covers the fs.Storage contract; it cannot see HTTP status
# codes, headers, SigV4 or real boto3 clients, which is what this adds.
#
# It gates on .github/s3tests/allow.txt minus
# .github/s3tests/cluster/known-failures.txt — tests that pass single-node but
# not yet in cluster mode. That file is a bug list, not a scope statement: it
# should only ever shrink. See .github/s3tests/README.md.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '43 6 * * 1' # Mondays 06:43 UTC, after the single-node job
  workflow_dispatch:

permissions:
  contents: read

env:
  # Keep in lockstep with .github/workflows/s3tests.yml: the two runs must
  # execute the same suite revision or their results are not comparable.
  S3TESTS_REF: 5522d1c351f75bc00ae0f64f742f3f095f5939d9

jobs:
  s3tests-cluster:
    runs-on: ubuntu-latest

    services:
      etcd:
        image: gcr.io/etcd-development/etcd:v3.6.1
        ports:
          - 12379:2379
        env:
          ETCD_NAME: s3tests
          ETCD_DATA_DIR: /etcd-data
          ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
          ETCD_ADVERTISE_CLIENT_URLS: http://127.0.0.1:12379

    steps:
      - name: Checkout fs
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Start cluster
        env:
          # Use the service container rather than letting the script start its
          # own etcd in Docker.
          ETCD_ENDPOINT: http://127.0.0.1:12379
        run: ./scripts/s3tests-cluster.sh up

      - name: Checkout s3-tests
        uses: actions/checkout@v7
        with:
          repository: ceph/s3-tests
          ref: ${{ env.S3TESTS_REF }}
          path: s3-tests

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: s3-tests/requirements.txt

      - name: Install s3-tests dependencies
        working-directory: s3-tests
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run allow-listed tests (gating)
        env:
          S3TEST_CONF: ${{ github.workspace }}/.github/s3tests/cluster/s3tests.conf
          AWS_MAX_ATTEMPTS: '2'
        working-directory: s3-tests
        run: |
          # Strip comments (whole-line and trailing) and surrounding whitespace,
          # then sort under LC_ALL=C: comm requires both inputs in the same
          # collation order and bails on locale-sorted input. Real temp files,
          # not process substitution — comm is unreliable reading two pipes.
          strip() {
            sed -e 's/#.*//' -e 's/[[:space:]]*$//' -e 's/^[[:space:]]*//' "$1" \
              | sed '/^$/d' | LC_ALL=C sort -u > "$2"
          }

          strip "${GITHUB_WORKSPACE}/.github/s3tests/allow.txt" /tmp/allow.lst
          strip "${GITHUB_WORKSPACE}/.github/s3tests/cluster/known-failures.txt" /tmp/known.lst

          # A known-failure absent from allow.txt means the two files have
          # drifted; fail loudly rather than silently gating on less.
          orphans=$(LC_ALL=C comm -13 /tmp/allow.lst /tmp/known.lst)
          if [ -n "$orphans" ]; then
            echo "::error::known-failures.txt lists tests absent from allow.txt:"
            echo "$orphans"
            exit 1
          fi

          mapfile -t tests < <(LC_ALL=C comm -23 /tmp/allow.lst /tmp/known.lst)
          excluded=$(wc -l < /tmp/known.lst)
          echo "Running ${#tests[@]} allow-listed tests (${excluded} excluded as known cluster failures)"

          python -m pytest -p no:cacheprovider -q --no-header \
            --junit-xml="${GITHUB_WORKSPACE}/s3tests-cluster-allow.xml" "${tests[@]}"

      - name: Run known failures (informational)
        # Surfaces any that have started passing, so known-failures.txt can
        # shrink. Never fails the job.
        if: always()
        continue-on-error: true
        env:
          S3TEST_CONF: ${{ github.workspace }}/.github/s3tests/cluster/s3tests.conf
          AWS_MAX_ATTEMPTS: '2'
        working-directory: s3-tests
        run: |
          mapfile -t known < <(sed 's/#.*//' \
            "${GITHUB_WORKSPACE}/.github/s3tests/cluster/known-failures.txt" \
            | sed '/^[[:space:]]*$/d')

          [ "${#known[@]}" -eq 0 ] && { echo "no known failures left"; exit 0; }

          python -m pytest -p no:cacheprovider -q --no-header --tb=no \
            --junit-xml="${GITHUB_WORKSPACE}/s3tests-cluster-known.xml" "${known[@]}" || true

      - name: Collect node logs
        if: always()
        run: ./scripts/s3tests-cluster.sh logs > cluster-nodes.log 2>&1 || true

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: s3tests-cluster-reports
          path: |
            s3tests-cluster-*.xml
            cluster-nodes.log
          if-no-files-found: ignore

      - name: Stop cluster
        if: always()
        env:
          ETCD_ENDPOINT: http://127.0.0.1:12379
        run: ./scripts/s3tests-cluster.sh down || true
