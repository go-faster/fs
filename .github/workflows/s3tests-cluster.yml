name: s3tests-cluster

# Runs the ceph/s3-tests conformance suite against a CLUSTERED fs: three nodes
# in three racks over a real etcd, writing at quorum across failure domains.
#
# The single-node s3tests workflow proves the S3 surface is correct over
# storagefs. This one proves the same surface stays correct over the replicated
# data plane — the wire behaviour a client sees must not depend on how many
# nodes are behind the endpoint. clusterstore's Go-level conformance test
# (storagetest.Run) covers the fs.Storage contract; it cannot see HTTP status
# codes, headers, SigV4 or real boto3 clients, which is what this adds.
#
# It runs the same whole suite the single-node job runs and gates on the union
# of .github/s3tests/known-failures.txt and
# .github/s3tests/cluster/known-failures.txt — the second naming tests that pass
# single-node but not yet in cluster mode. That file is a bug list, not a scope
# statement: it should only ever shrink. See .github/s3tests/README.md.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '43 6 * * 1' # Mondays 06:43 UTC, after the single-node job
  workflow_dispatch:

permissions:
  contents: read

env:
  # Keep in lockstep with .github/workflows/s3tests.yml: the two runs must
  # execute the same suite revision or their results are not comparable.
  S3TESTS_REF: 5522d1c351f75bc00ae0f64f742f3f095f5939d9

jobs:
  s3tests-cluster:
    runs-on: ubuntu-latest

    services:
      etcd:
        image: gcr.io/etcd-development/etcd:v3.6.1
        ports:
          - 12379:2379
        env:
          ETCD_NAME: s3tests
          ETCD_DATA_DIR: /etcd-data
          ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
          ETCD_ADVERTISE_CLIENT_URLS: http://127.0.0.1:12379

    steps:
      - name: Checkout fs
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Start cluster
        env:
          # Use the service container rather than letting the script start its
          # own etcd in Docker.
          ETCD_ENDPOINT: http://127.0.0.1:12379
        run: ./scripts/s3tests-cluster.sh up

      - name: Checkout s3-tests
        uses: actions/checkout@v7
        with:
          repository: ceph/s3-tests
          ref: ${{ env.S3TESTS_REF }}
          path: s3-tests

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: s3-tests/requirements.txt

      - name: Install s3-tests dependencies
        working-directory: s3-tests
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run the suite against the cluster
        env:
          S3TEST_CONF: ${{ github.workspace }}/.github/s3tests/cluster/s3tests.conf
          AWS_MAX_ATTEMPTS: '2'
        working-directory: s3-tests
        run: |
          python -m pytest -p no:cacheprovider -q --no-header --tb=line \
            --junit-xml="${GITHUB_WORKSPACE}/s3tests-cluster.xml" \
            s3tests/functional/test_s3.py || true

          python -m pytest -p no:cacheprovider -q --no-header --tb=line \
            --junit-xml="${GITHUB_WORKSPACE}/s3tests-cluster-headers.xml" \
            s3tests/functional/test_headers.py || true

      - name: Gate on both known-failures lists
        run: |
          # A client must not be able to tell how many nodes are behind the
          # endpoint, so the cluster is held to the single-node list — but it
          # does not *own* it: a test that fails on one node and passes on
          # three is not a cluster bug. The cluster file is the one this job
          # ratchets down, and every line in it is a bug.
          go run ./scripts/s3tests check \
            --known .github/s3tests/known-failures.txt \
            --ratchet .github/s3tests/cluster/known-failures.txt \
            --report s3tests-cluster.xml \
            --report s3tests-cluster-headers.xml

      - name: Collect node logs
        if: always()
        run: ./scripts/s3tests-cluster.sh logs > cluster-nodes.log 2>&1 || true

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: s3tests-cluster-reports
          path: |
            s3tests-cluster*.xml
            cluster-nodes.log
          if-no-files-found: ignore

      - name: Stop cluster
        if: always()
        env:
          ETCD_ENDPOINT: http://127.0.0.1:12379
        run: ./scripts/s3tests-cluster.sh down || true
