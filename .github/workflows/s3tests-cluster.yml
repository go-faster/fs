name: s3tests-cluster

# Runs the S3 conformance suite (go-faster/s3t) against a CLUSTERED fs: three nodes
# in three racks over a real etcd, writing at quorum across failure domains.
#
# The single-node s3tests workflow proves the S3 surface is correct over
# storagefs. This one proves the same surface stays correct over the replicated
# data plane — the wire behaviour a client sees must not depend on how many
# nodes are behind the endpoint. clusterstore's Go-level conformance test
# (storagetest.Run) covers the fs.Storage contract; it cannot see HTTP status
# codes, headers, SigV4 or real boto3 clients, which is what this adds.
#
# It runs the same whole suite the single-node job runs and gates on the union
# of .github/s3tests/known-failures.txt and
# .github/s3tests/cluster/known-failures.txt — the second naming tests that pass
# single-node but not yet in cluster mode. That file is a bug list, not a scope
# statement: it should only ever shrink. See .github/s3tests/README.md.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '43 6 * * 1' # Mondays 06:43 UTC, after the single-node job
  workflow_dispatch:

permissions:
  contents: read

# One run per ref; see the same block in s3tests.yml for why.
concurrency:
  group: s3tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned for reproducibility; keep in lockstep with s3tests.yml.
  S3T_REF: 51506ac904f6e35424b3ec9d38716985023beba6

jobs:
  s3tests-cluster:
    runs-on: ubuntu-latest
    # Three nodes and etcd, so slower than the single-node job, but nowhere
    # near this. Hitting it means stuck, not busy.
    timeout-minutes: 15

    services:
      etcd:
        image: gcr.io/etcd-development/etcd:v3.6.1
        ports:
          - 12379:2379
        env:
          ETCD_NAME: s3tests
          ETCD_DATA_DIR: /etcd-data
          ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
          ETCD_ADVERTISE_CLIENT_URLS: http://127.0.0.1:12379

    steps:
      - name: Checkout fs
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Start cluster
        env:
          # Use the service container rather than letting the script start its
          # own etcd in Docker.
          ETCD_ENDPOINT: http://127.0.0.1:12379
        run: ./scripts/s3tests-cluster.sh up

      - name: Install s3t
        run: |
          # The checksum database occasionally answers 500, which fails an
          # otherwise fine install. Retry rather than re-run the job by hand:
          # it has cost two red pipelines already, and neither was a real
          # failure. Verification is not skipped — only retried.
          for attempt in 1 2 3; do
            if go install "github.com/go-faster/s3t/cmd/s3t@${S3T_REF}"; then
              exit 0
            fi
            echo "install attempt ${attempt} failed; retrying"
            sleep 5
          done
          echo "::error::could not install s3t after 3 attempts"
          exit 1

      - name: Run the suite against the cluster
        run: |
          # A client must not be able to tell how many nodes are behind the
          # endpoint, so the cluster is held to the single-node list — but it
          # does not *own* it: a test that fails on one node and passes on
          # three is not a cluster bug. The two files are concatenated because
          # s3t takes one deny-list, and every line in the cluster file is a
          # bug rather than a scope decision.
          cat .github/s3tests/known-failures.txt \
              .github/s3tests/cluster/known-failures.txt > cluster-known-failures.txt

          s3t run \
            --config .github/s3tests/cluster/s3tests.conf \
            --known-failures cluster-known-failures.txt \
            --junit s3tests-cluster.xml \
            --json s3tests-cluster.json \
            --timeout 60s

      - name: Show why the tests failed
        if: failure()
        run: |
          # The run log names the failing tests but never says why: the detail
          # is only in the report. That used to mean a flake cost a blind
          # re-run — and the re-run then destroyed its own evidence, because it
          # overwrote the artifact with a passing one. Print it here instead,
          # where the log for this attempt is permanent.
          jq -r 'select(.status == "failed" or .status == "error")
                 | "\n=== \(.node_id) ===\n\(.output // "no output recorded")"' \
            s3tests-cluster.json || true

      - name: Collect node logs
        if: always()
        run: ./scripts/s3tests-cluster.sh logs > cluster-nodes.log 2>&1 || true

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: s3tests-cluster-reports-attempt-${{ github.run_attempt }}
          path: |
            s3tests-cluster*.xml
            s3tests-cluster*.json
            cluster-nodes.log
          if-no-files-found: ignore

      - name: Stop cluster
        if: always()
        env:
          ETCD_ENDPOINT: http://127.0.0.1:12379
        run: ./scripts/s3tests-cluster.sh down || true
