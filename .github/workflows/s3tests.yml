name: s3tests

# Runs the ceph/s3-tests conformance suite (https://github.com/ceph/s3-tests)
# against a freshly built server.
#
# The WHOLE suite runs on every pull request — it takes about 80 seconds — and
# the gate is a deny-list: .github/s3tests/known-failures.txt names the tests
# expected to fail, and the job fails if anything outside it fails *or* if
# anything inside it passes.
#
# Running the full suite and gating on a deny-list is what makes the list able
# to shrink on its own. An allow-list only grows: a newly passing test stays
# invisible until someone runs the suite by hand, and a newly failing test
# outside the list is never noticed. Both now show up on the pull request that
# caused them.
#
# See .github/s3tests/README.md.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 6 * * 1' # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

# One run per ref. Without this a superseded run keeps going, and a run that
# hangs keeps going for the six hours GitHub allows — four of them were still
# holding runners hours after the commits they tested had been replaced.
concurrency:
  group: s3tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned for reproducibility; bump deliberately and re-baseline the
  # known-failures list (see scripts/s3tests).
  S3TESTS_REF: 5522d1c351f75bc00ae0f64f742f3f095f5939d9
  S3_PORT: '8077'

jobs:
  s3tests:
    runs-on: ubuntu-latest
    # Sized so the per-file timeouts below always fire first: a job timeout
    # cancels the run and takes the diagnostic with it, whereas a per-file
    # timeout fails the step and leaves the report and the server log behind.
    timeout-minutes: 25
    steps:
      - name: Checkout fs
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Check CONFORMANCE.md is up to date
        run: |
          go run ./scripts/gencompat
          if ! git diff --exit-code docs/CONFORMANCE.md; then
            echo "::error::docs/CONFORMANCE.md is stale — run 'make compat' after editing known-failures.txt."
            exit 1
          fi

      - name: Build server
        run: go build -o fs ./cmd/fs

      - name: Start server
        run: |
          mkdir -p .s3data-ci
          # Run AUTHENTICATED: the config carries the ceph/s3-tests credentials
          # so the suite exercises SigV4 through boto3. The anonymous-access
          # tests in the allow-list pass via canned public-read/-write ACLs.
          ./fs s3 --config .github/s3tests/server.yaml --addr ":${S3_PORT}" --root ./.s3data-ci > fs-server.log 2>&1 &
          echo "$!" > fs.pid
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null "http://localhost:${S3_PORT}/health"; then
              echo "server up"; exit 0
            fi
            sleep 1
          done
          echo "server did not become healthy"; cat fs-server.log; exit 1

      - name: Checkout s3-tests
        uses: actions/checkout@v7
        with:
          repository: ceph/s3-tests
          ref: ${{ env.S3TESTS_REF }}
          path: s3-tests

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: s3-tests/requirements.txt

      - name: Install s3-tests dependencies
        working-directory: s3-tests
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run the suite
        env:
          S3TEST_CONF: ${{ github.workspace }}/.github/s3tests/s3tests.conf
          AWS_MAX_ATTEMPTS: '2'
        working-directory: s3-tests
        run: |
          # The suite is expected to have failures — the gate is the next step,
          # which decides which of them are allowed. The timeouts are not:
          # each file runs in well under a minute, so hitting one means a
          # client is stuck waiting on the server, and that has to surface as
          # a report rather than as a job that never ends.
          run_suite() {
            local file="$1" out="$2" rc=0

            # SIGINT rather than SIGTERM so pytest still writes its report for
            # the tests that did run, which names the one it is stuck on.
            timeout --signal=INT --kill-after=30s 5m \
              python -m pytest -p no:cacheprovider -q --no-header --tb=line \
                --junit-xml="${out}" "s3tests/functional/${file}" || rc=$?

            # timeout(1) reports giving up as 124 (GNU) or 125 (uutils, which
            # some images ship). pytest's own exit codes are 0-5, so anything
            # from 124 up is the timeout and nothing else; a lower non-zero is
            # pytest reporting test failures, which is the normal case here.
            if [ "${rc}" -ge 124 ]; then
              echo "::error::${file} did not finish within 5m — the suite is stuck"
              echo "--- last 200 lines of the server log ---"
              tail -n 200 "${GITHUB_WORKSPACE}/fs-server.log" || true
              return 1
            fi
          }

          run_suite test_s3.py "${GITHUB_WORKSPACE}/s3tests.xml"
          run_suite test_headers.py "${GITHUB_WORKSPACE}/s3tests-headers.xml"

      - name: Gate on the known-failures list
        run: |
          go run ./scripts/s3tests check \
            --ratchet .github/s3tests/known-failures.txt \
            --report s3tests.xml \
            --report s3tests-headers.xml

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: s3tests-reports
          path: |
            s3tests*.xml
            fs-server.log
          if-no-files-found: ignore

      - name: Stop server
        if: always()
        run: kill "$(cat fs.pid)" 2>/dev/null || true
