name: s3tests

# Runs the S3 conformance suite against a freshly built server, using
# go-faster/s3t — a Go port of ceph/s3-tests that ships as one binary.
#
# The gate is a deny-list: .github/s3tests/known-failures.txt names the tests
# expected to fail, and s3t fails the job if anything outside it fails *or* if
# anything inside it passes. Running the whole suite and gating on a deny-list
# is what lets the list shrink on its own — an allow-list only grows, because a
# newly passing test stays invisible until someone runs the suite by hand and a
# newly failing one outside the list is never noticed.
#
# See .github/s3tests/README.md.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 6 * * 1' # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

# One run per ref: a superseded run has nothing left to tell us.
concurrency:
  group: s3tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned for reproducibility; bump deliberately and re-baseline the
  # known-failures list.
  S3T_REF: 9a2d2ebb162e9357fcaa9cc5b0d42ead1138da0e
  S3_PORT: '8077'

jobs:
  s3tests:
    runs-on: ubuntu-latest
    # The suite takes seconds. s3t bounds each test itself and aborts on a
    # stalled run, so this is only a backstop against the job wedging.
    timeout-minutes: 10
    steps:
      - name: Checkout fs
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Check CONFORMANCE.md is up to date
        run: |
          go run ./scripts/gencompat
          if ! git diff --exit-code docs/CONFORMANCE.md; then
            echo "::error::docs/CONFORMANCE.md is stale — run 'make compat' after editing known-failures.txt."
            exit 1
          fi

      - name: Install s3t
        run: |
          # The checksum database occasionally answers 500, which fails an
          # otherwise fine install. Retry rather than re-run the job by hand:
          # it has cost two red pipelines already, and neither was a real
          # failure. Verification is not skipped — only retried.
          for attempt in 1 2 3; do
            if go install "github.com/go-faster/s3t/cmd/s3t@${S3T_REF}"; then
              exit 0
            fi
            echo "install attempt ${attempt} failed; retrying"
            sleep 5
          done
          echo "::error::could not install s3t after 3 attempts"
          exit 1

      - name: Build server
        run: go build -o fs ./cmd/fs

      - name: Start server
        run: |
          mkdir -p .s3data-ci
          # Run AUTHENTICATED: the config carries the suite's credentials so it
          # exercises SigV4. The anonymous-access tests pass via canned
          # public-read/-write ACLs. The localhost domain serves
          # <bucket>.localhost as virtual hosts for the second run; the first
          # run's path-style requests are unaffected.
          ./fs s3 --config .github/s3tests/server.yaml --addr ":${S3_PORT}" --root ./.s3data-ci --domain localhost > fs-server.log 2>&1 &
          echo "$!" > fs.pid
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null "http://localhost:${S3_PORT}/health"; then
              echo "server up"; exit 0
            fi
            sleep 1
          done
          echo "server did not become healthy"; cat fs-server.log; exit 1

      - name: Run the suite
        run: |
          # s3t is the gate: it fails when a test outside the list fails, and
          # when one inside it passes. No separate checker step.
          s3t run \
            --config .github/s3tests/s3tests.conf \
            --known-failures .github/s3tests/known-failures.txt \
            --junit s3tests.xml \
            --json s3tests.json \
            --timeout 60s

      - name: Run the suite with virtual-host addressing
        run: |
          # The same suite and gate, every bucket addressed as
          # <bucket>.localhost (s3t dials it as localhost; no DNS needed).
          # Fresh random bucket names keep it apart from the first run.
          sed 's/^\[DEFAULT\]$/[DEFAULT]\naddressing_style = virtual/' \
            .github/s3tests/s3tests.conf > s3tests-virtual.conf
          s3t run \
            --config s3tests-virtual.conf \
            --known-failures .github/s3tests/known-failures.txt \
            --junit s3tests-virtual.xml \
            --json s3tests-virtual.json \
            --timeout 60s

      - name: Show why the tests failed
        if: failure()
        run: |
          # The run log names the failing tests but never says why: the detail
          # is only in the report. That used to mean a flake cost a blind
          # re-run — and the re-run then destroyed its own evidence, because it
          # overwrote the artifact with a passing one. Print it here instead,
          # where the log for this attempt is permanent.
          for report in s3tests.json s3tests-virtual.json; do
            [ -f "$report" ] || continue
            echo "##### ${report}"
            jq -r 'select(.status == "failed" or .status == "error")
                   | "\n=== \(.node_id) ===\n\(.output // "no output recorded")"' \
              "$report" || true
          done

      - name: Show server log on failure
        if: failure()
        run: tail -n 200 fs-server.log || true

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: s3tests-reports-attempt-${{ github.run_attempt }}
          path: |
            s3tests.xml
            s3tests.json
            s3tests-virtual.xml
            s3tests-virtual.json
            fs-server.log
          if-no-files-found: ignore

      - name: Stop server
        if: always()
        run: kill "$(cat fs.pid)" 2>/dev/null || true

  # The same suite against a three-node engine cluster: node 1 serves S3, every
  # write is replicated to the other two at quorum. Same deny-list as above.
  s3tests-cluster:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout fs
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Install s3t
        run: |
          for attempt in 1 2 3; do
            if go install "github.com/go-faster/s3t/cmd/s3t@${S3T_REF}"; then
              exit 0
            fi
            echo "install attempt ${attempt} failed; retrying"
            sleep 5
          done
          echo "::error::could not install s3t after 3 attempts"
          exit 1

      - name: Build server
        run: go build -o fs ./cmd/fs

      - name: Start cluster
        run: scripts/s3tests-cluster.sh up ./fs

      - name: Run the suite
        run: |
          s3t run \
            --config .github/s3tests/s3tests.conf \
            --known-failures .github/s3tests/known-failures.txt \
            --junit s3tests-cluster.xml \
            --json s3tests-cluster.json \
            --timeout 60s

      - name: Show why the tests failed
        if: failure()
        run: |
          jq -r 'select(.status == "failed" or .status == "error")
                 | "\n=== \(.node_id) ===\n\(.output // "no output recorded")"' \
            s3tests-cluster.json || true

      - name: Show server logs on failure
        if: failure()
        run: tail -n 100 .s3tests-cluster/n*/server.log || true

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: s3tests-cluster-reports-attempt-${{ github.run_attempt }}
          path: |
            s3tests-cluster.xml
            s3tests-cluster.json
            .s3tests-cluster/n*/server.log
          if-no-files-found: ignore

      - name: Stop cluster
        if: always()
        run: scripts/s3tests-cluster.sh down
