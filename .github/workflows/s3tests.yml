name: s3tests

# Runs the S3 conformance suite against a freshly built server, using
# go-faster/s3t — a Go port of ceph/s3-tests that ships as one binary.
#
# The gate is a deny-list: .github/s3tests/known-failures.txt names the tests
# expected to fail, and s3t fails the job if anything outside it fails *or* if
# anything inside it passes. Running the whole suite and gating on a deny-list
# is what lets the list shrink on its own — an allow-list only grows, because a
# newly passing test stays invisible until someone runs the suite by hand and a
# newly failing one outside the list is never noticed.
#
# See .github/s3tests/README.md.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 6 * * 1' # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

# One run per ref: a superseded run has nothing left to tell us.
concurrency:
  group: s3tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned for reproducibility; bump deliberately and re-baseline the
  # known-failures list.
  S3T_REF: 05a4517597380c7bb3077c485688e3cafc96b92d
  S3_PORT: '8077'

jobs:
  s3tests:
    runs-on: ubuntu-latest
    # The suite takes seconds. s3t bounds each test itself and aborts on a
    # stalled run, so this is only a backstop against the job wedging.
    timeout-minutes: 10
    steps:
      - name: Checkout fs
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Check CONFORMANCE.md is up to date
        run: |
          go run ./scripts/gencompat
          if ! git diff --exit-code docs/CONFORMANCE.md; then
            echo "::error::docs/CONFORMANCE.md is stale — run 'make compat' after editing known-failures.txt."
            exit 1
          fi

      - name: Install s3t
        run: go install "github.com/go-faster/s3t/cmd/s3t@${S3T_REF}"

      - name: Build server
        run: go build -o fs ./cmd/fs

      - name: Start server
        run: |
          mkdir -p .s3data-ci
          # Run AUTHENTICATED: the config carries the suite's credentials so it
          # exercises SigV4. The anonymous-access tests pass via canned
          # public-read/-write ACLs.
          ./fs s3 --config .github/s3tests/server.yaml --addr ":${S3_PORT}" --root ./.s3data-ci > fs-server.log 2>&1 &
          echo "$!" > fs.pid
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null "http://localhost:${S3_PORT}/health"; then
              echo "server up"; exit 0
            fi
            sleep 1
          done
          echo "server did not become healthy"; cat fs-server.log; exit 1

      - name: Run the suite
        run: |
          # s3t is the gate: it fails when a test outside the list fails, and
          # when one inside it passes. No separate checker step.
          s3t run \
            --config .github/s3tests/s3tests.conf \
            --known-failures .github/s3tests/known-failures.txt \
            --junit s3tests.xml \
            --json s3tests.json \
            --timeout 60s

      - name: Show server log on failure
        if: failure()
        run: tail -n 200 fs-server.log || true

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: s3tests-reports
          path: |
            s3tests.xml
            s3tests.json
            fs-server.log
          if-no-files-found: ignore

      - name: Stop server
        if: always()
        run: kill "$(cat fs.pid)" 2>/dev/null || true
