# The cluster's front door: one S3 endpoint over three nodes.
#
# Every node serves every key, so this is a plain round-robin rather than
# anything that has to understand S3 — which is also how a real deployment
# fronts a cluster. It matters for the demo because it is what lets a node be
# stopped without the endpoint going with it.

upstream fs_nodes {
    server fs1:8080 max_fails=2 fail_timeout=5s;
    server fs2:8080 max_fails=2 fail_timeout=5s;
    server fs3:8080 max_fails=2 fail_timeout=5s;
}

server {
    listen 9000;

    # Objects here reach tens of MiB and a body is streamed straight through,
    # so neither a size cap nor buffering to disk belongs in the path.
    client_max_body_size 0;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_http_version 1.1;

    location / {
        proxy_pass http://fs_nodes;

        # S3 signs the Host header, so it has to survive the hop.
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # A node that goes away mid-request: try the next one rather than
        # handing the client a 502.
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_connect_timeout 3s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
