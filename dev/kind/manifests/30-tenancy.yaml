# Tenancy on top of the cluster: one bucket and one credential, so `make up`
# lands on something you can immediately point an S3 client at.
#
# Both reference the FSCluster by name within the same namespace — that is the
# only reference the operator allows.
---
# bucketName defaults to metadata.name and is immutable. No scheme override, so
# the bucket follows the cluster default (rf2.5).
apiVersion: fs.go-faster.org/v1alpha1
kind: FSBucket
metadata:
  name: dev
  namespace: fs-dev
spec:
  clusterRef:
    name: fs
  # Retain (the default) on purpose, even though this is a dev setup: with
  # Delete the operator refuses to finalize a bucket that still holds objects
  # ("bucket dev is not empty"), so `make clean` blocks until you empty it by
  # hand. Retain just stops managing the bucket; the data goes away with the
  # cluster's PVCs, which 20-fscluster.yaml already reclaims on delete.
  reclaimPolicy: Retain
---
# A generated credential: the operator mints the access/secret pair once and
# writes it to an owned Secret named <metadata.name>-credentials, with keys
# access-key, secret-key and endpoint. `make creds` prints it.
apiVersion: fs.go-faster.org/v1alpha1
kind: FSAccessKey
metadata:
  name: dev
  namespace: fs-dev
spec:
  clusterRef:
    name: fs
  grants:
    - bucket: "dev"
      permission: admin
